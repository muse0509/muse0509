<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Yusuke Kikuta - Full-stack Product Engineer</title>
  <desc id="description">Dark editorial profile banner with bronze accents for a product engineer specializing in web, AI automation, and Solana.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020201" />
      <stop offset="0.58" stop-color="#090806" />
      <stop offset="1" stop-color="#14100c" />
    </linearGradient>
    <radialGradient id="halo" cx="0.78" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#C77D36" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#C77D36" stop-opacity="0.06" />
      <stop offset="1" stop-color="#C77D36" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F5EFE5" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <linearGradient id="bronzeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77D36" stop-opacity="0" />
      <stop offset="0.2" stop-color="#C77D36" />
      <stop offset="0.8" stop-color="#E4A667" />
      <stop offset="1" stop-color="#C77D36" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)" />
  <rect width="1200" height="420" rx="28" fill="url(#halo)" />
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#C77D36" stroke-opacity="0.38" stroke-width="2" />
  <rect x="28" y="28" width="1144" height="364" rx="18" fill="url(#grid)" />

  <path d="M74 62V358" stroke="#C77D36" stroke-width="3" />
  <path d="M91 62H173" stroke="#C77D36" stroke-width="3" />
  <path d="M91 358H294" stroke="#C77D36" stroke-width="3" />

  <text x="110" y="88" fill="#C77D36" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="4.5">YUSUKE KIKUTA / MUSE</text>
  <text x="108" y="188" fill="#F6F0E7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="720" letter-spacing="1">FULL-STACK</text>
  <text x="108" y="260" fill="#C77D36" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="720" letter-spacing="1">PRODUCT ENGINEER</text>
  <text x="111" y="311" fill="#D7CFC3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="500" letter-spacing="3">WEB  /  AI AUTOMATION  /  SOLANA</text>

  <line x1="606" y1="341" x2="1091" y2="341" stroke="url(#bronzeLine)" stroke-width="1.5" />
  <text x="1092" y="366" fill="#968C80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="end" letter-spacing="2.2">FROM REQUIREMENTS TO RELIABLE DELIVERY</text>

  <g transform="translate(1012 64)">
    <circle cx="64" cy="64" r="61" fill="#080705" stroke="#C77D36" stroke-opacity="0.58" stroke-width="1.5" />
    <circle cx="64" cy="64" r="48" fill="none" stroke="#F6F0E7" stroke-opacity="0.12" stroke-width="1" />
    <path d="M38 38L64 64L90 38M64 64V96" fill="none" stroke="#C77D36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="64" cy="64" r="5" fill="#F6F0E7" />
  </g>

  <circle cx="1121" cy="300" r="3" fill="#C77D36" />
  <circle cx="1141" cy="300" r="3" fill="#F6F0E7" fill-opacity="0.34" />
  <circle cx="1161" cy="300" r="3" fill="#F6F0E7" fill-opacity="0.14" />
